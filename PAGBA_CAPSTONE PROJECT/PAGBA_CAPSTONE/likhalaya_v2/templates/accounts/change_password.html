{% extends 'base.html' %}
{% block title %}Change Password – Likhalaya{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary btn-sm rounded-3 mb-3">
        <i class="fas fa-arrow-left me-1"></i>Back to Profile
      </a>
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-teal text-white border-0 py-3 px-4 rounded-top" style="background:var(--teal)!important;">
          <h5 class="fw-bold mb-0"><i class="fas fa-lock me-2"></i>Change Password</h5>
        </div>
        <div class="card-body p-4">
          <form method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
              <label class="form-label fw-semibold small">{{ field.label }}</label>
              <input type="password" name="{{ field.html_name }}" class="form-control" style="border-radius:10px;" placeholder="{{ field.label }}">
              {% if field.errors %}<div class="text-danger mt-1" style="font-size:12px;">{{ field.errors.0 }}</div>{% endif %}
            </div>
            {% endfor %}
            <div class="d-flex gap-2 mt-4">
              <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary flex-fill">Cancel</a>
              <button type="submit" class="btn btn-teal flex-fill"><i class="fas fa-save me-1"></i>Update Password</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
